<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Календарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Theming has two layers.
     Telegram sets --tg-theme-* on :root as inline style and rewrites them the
     moment the client theme changes, so the palette follows along with no
     redraw. But clients differ in which params they send — an older one may
     give bg-color and no secondary-bg-color — and a light-only fallback would
     then paint white cards onto a dark background. So every fallback comes in
     both schemes, chosen by --fb-* below. */
  :root {
    color-scheme: light;
    --fb-bg: #ffffff;
    --fb-card: #f1f2f6;
    --fb-text: #12161f;
    --fb-hint: #8a8f99;
    --fb-accent: #2f81f7;
    --fb-link: #2f81f7;
  }
  /* Outside Telegram (dev in a browser) the OS preference decides… */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --fb-bg: #17212b;
      --fb-card: #232e3c;
      --fb-text: #ffffff;
      --fb-hint: #708499;
      --fb-accent: #5288c1;
      --fb-link: #6ab3f3;
    }
  }
  /* …and inside it, tg.colorScheme does, whichever way the OS is set. */
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --fb-bg: #17212b;
    --fb-card: #232e3c;
    --fb-text: #ffffff;
    --fb-hint: #708499;
    --fb-accent: #5288c1;
    --fb-link: #6ab3f3;
  }
  /* Shading alpha for calendar marks. A tint tuned for a white card reads as
     mud on a near-black one, so dark gets a stronger one. Keeping it here — not
     in the inline style the renderer writes — is what makes it survive a live
     theme switch without a redraw. */
  :root { --mark-a: .18; --mark-b: .45; }
  @media (prefers-color-scheme: dark) { :root { --mark-a: .26; --mark-b: .55; } }
  :root[data-scheme="dark"] { --mark-a: .26; --mark-b: .55; }
  :root[data-scheme="light"] { --mark-a: .18; --mark-b: .45; }

  /* Every shaded thing carries both hexes inline and picks one here, so the
     choice is CSS's — that is what keeps it correct after a live theme flip. */
  .mk { --mrgb: var(--mark-rgb); --mc: var(--mark); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-scheme="light"]) .mk { --mrgb: var(--mark-rgb-d); --mc: var(--mark-d); }
  }
  :root[data-scheme="dark"] .mk { --mrgb: var(--mark-rgb-d); --mc: var(--mark-d); }
  :root[data-scheme="light"] .mk { --mrgb: var(--mark-rgb); --mc: var(--mark); }

  :root[data-scheme="light"] {
    color-scheme: light;
    --fb-bg: #ffffff;
    --fb-card: #f1f2f6;
    --fb-text: #12161f;
    --fb-hint: #8a8f99;
    --fb-accent: #2f81f7;
    --fb-link: #2f81f7;
  }

  :root {
    --bg:     var(--tg-theme-bg-color, var(--fb-bg));
    --card:   var(--tg-theme-secondary-bg-color, var(--fb-card));
    --text:   var(--tg-theme-text-color, var(--fb-text));
    --hint:   var(--tg-theme-hint-color, var(--fb-hint));
    --accent: var(--tg-theme-button-color, var(--fb-accent));
    --onaccent: var(--tg-theme-button-text-color, #ffffff);
    --link:   var(--tg-theme-link-color, var(--fb-link));
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    /* Priority colours are ours, not Telegram's, and are picked to stay legible
       on both the light and the dark card. */
    --p4: #e5484d;
    --p3: #f0883e;
    --p2: #2f81f7;
    --p1: var(--hint);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 0 12px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: 10px; }

  /* Segmented month/week switch. */
  .seg { display: flex; background: var(--card); border-radius: 9px; padding: 2px; }
  .seg button {
    flex: 1; border: 0; border-radius: 7px; padding: 7px 0;
    background: transparent; color: var(--hint);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .seg button[aria-selected="true"] { background: var(--accent); color: var(--onaccent); }

  .nav { display: flex; align-items: center; gap: 4px; margin: 10px 0 6px; }
  .nav .title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }
  .nav button {
    border: 0; background: transparent; color: var(--link);
    font: inherit; font-size: 19px; line-height: 1;
    padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  .nav .today { font-size: 14px; font-weight: 600; }

  /* --- month grid --- */
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 2px; }
  .dow div { text-align: center; font-size: 11px; color: var(--hint); padding: 2px 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cell {
    aspect-ratio: 1 / 1; border: 0; border-radius: 9px; padding: 3px 0 0;
    background: var(--card); color: var(--text);
    font: inherit; font-size: 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .cell.blank { background: transparent; cursor: default; }
  /* A shaded day keeps its task dots — the tint is a separate fact about the
     day, so it goes on the background and never on the dots. Selection still
     wins: which day you are looking at matters more than what kind it is. */
  .cell.marked {
    background: rgba(var(--mrgb), var(--mark-a));
    box-shadow: inset 0 0 0 1px rgba(var(--mrgb), var(--mark-b));
  }
  .cell.dim { color: var(--hint); }
  .cell.today { outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 700; }
  .cell[aria-pressed="true"] { background: var(--accent); color: var(--onaccent); }
  .cell[aria-pressed="true"] .dot { background: var(--onaccent) !important; }
  .dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--p1); }
  .more { font-size: 9px; color: var(--hint); line-height: 5px; }

  /* --- lists --- */
  h2 { font-size: 13px; font-weight: 600; color: var(--hint); margin: 18px 0 6px; text-transform: none; }
  h2 .count { font-weight: 400; }
  .day-head { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 6px; }
  .day-head .d { font-weight: 600; font-size: 15px; }
  .day-head.is-today .d { color: var(--accent); }
  .day-head .n { font-size: 12px; color: var(--hint); }
  /* Text stays --text: the mark colour is a mustard that fails contrast on a
     light card. The tint alone ties the chip to the shaded cells. */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: rgba(var(--mrgb), var(--mark-a)); color: var(--text); white-space: nowrap;
  }
  .chip::before {
    content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--mc);
  }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
  .legend span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--hint); }
  .legend i { width: 11px; height: 11px; border-radius: 4px; display: block;
              background: rgba(var(--mrgb), var(--mark-a));
              box-shadow: inset 0 0 0 1px rgba(var(--mrgb), var(--mark-b)); }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li.task {
    display: flex; align-items: flex-start; gap: 9px;
    background: var(--card); border-radius: 10px; padding: 10px 12px;
    cursor: pointer;
  }
  li.task .bar { width: 3px; align-self: stretch; border-radius: 2px; background: var(--p1); flex: none; }
  li.task .body { min-width: 0; flex: 1; }
  /* Both are spans inside a blockified flex item, so they need making block
     explicitly — inline they run together as "полить растения11:00 · Аня". */
  li.task .txt { display: block; overflow-wrap: anywhere; }
  li.task .meta { display: block; margin-top: 2px; font-size: 12px; color: var(--hint); }
  li.task.overdue .time { color: var(--danger); font-weight: 600; }

  .empty { color: var(--hint); font-size: 14px; padding: 8px 2px; }
  .muted { color: var(--hint); }
  .center { text-align: center; padding: 40px 16px; color: var(--hint); }
  .center a { color: var(--link); }

  details.undated { margin-top: 20px; }
  details.undated summary {
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--hint);
    padding: 6px 0; list-style: none;
  }
  details.undated summary::-webkit-details-marker { display: none; }
  details.undated summary::before { content: "▸ "; }
  details.undated[open] summary::before { content: "▾ "; }

  .foot { margin-top: 22px; text-align: center; font-size: 13px; }
  .foot a { color: var(--link); text-decoration: none; }
</style>
</head>
<body>
<div id="root"><div class="center">Загружаю…</div></div>

<script>
(function () {
  'use strict';

  var tg = window.Telegram && window.Telegram.WebApp;
  var root = document.getElementById('root');

  var DOW  = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  var MON  = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
              'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var MONN = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь',
              'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  var SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн',
               'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

  // Every date is a plain YYYY-MM-DD string. Arithmetic goes through UTC noon so
  // no local timezone or DST shift can ever move a task to the neighbouring day.
  function parse(s) { return new Date(s.slice(0, 10) + 'T12:00:00Z'); }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function addDays(s, n) { var d = parse(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
  function dowMon(s) { return (parse(s).getUTCDay() + 6) % 7; }   // 0 = Monday
  function monthStart(s) { return s.slice(0, 8) + '01'; }
  function weekStart(s) { return addDays(s, -dowMon(s)); }

  var state = {
    view: 'month',        // 'month' | 'week'
    anchor: null,         // any date inside the shown month/week
    selected: null,       // day opened under the month grid
    data: null,
    byDate: {},
    undated: [],
    markByDate: {},       // YYYY-MM-DD -> the mark covering it
  };

  // ------------------------------------------------------------------ data --
  function load() {
    var initData = (tg && tg.initData) || '';
    if (!initData) {
      root.innerHTML = '<div class="center">Эту страницу нужно открывать '
        + 'кнопкой «Календарь» в Telegram — снаружи данные не отдаются.</div>';
      return;
    }
    fetch('/api/tasks', { headers: { Authorization: 'tma ' + initData } })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
          return j;
        });
      })
      .then(function (d) {
        state.data = d;
        state.anchor = state.anchor || d.today;
        // Open on today's tasks. Landing on a grid with nothing under it reads
        // as "no tasks" rather than "pick a day".
        if (!state.selected) state.selected = d.today;
        state.byDate = {};
        state.undated = [];
        d.tasks.forEach(function (t) {
          if (!t.date) return void state.undated.push(t);
          (state.byDate[t.date] = state.byDate[t.date] || []).push(t);
        });
        // Ranges are stored compactly but looked up per cell, so expand once.
        // A school year is at most a few hundred marked days.
        state.markByDate = {};
        (d.marks || []).forEach(function (m) {
          var day = m.from, guard = 0;
          while (day <= (m.to || m.from) && guard++ < 400) {
            state.markByDate[day] = m;
            day = addDays(day, 1);
          }
        });
        Object.keys(state.byDate).forEach(function (k) {
          state.byDate[k].sort(function (a, b) {
            // Timed tasks first, in clock order; then by descending priority.
            if (!!a.time !== !!b.time) return a.time ? -1 : 1;
            if (a.time && a.time !== b.time) return a.time < b.time ? -1 : 1;
            return b.priority - a.priority;
          });
        });
        render();
      })
      .catch(function (e) {
        root.innerHTML = '<div class="center">Не получилось загрузить задачи.<br>'
          + esc(e.message) + '</div>';
      });
  }

  // ------------------------------------------------------------------- ui ---
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function tasksOn(day) { return state.byDate[day] || []; }
  function markOn(day) { return state.markByDate[day] || null; }
  function kindOf(mark) {
    return (state.data.markKinds || {})[mark.kind] || { label: mark.kind, color: '#e5a50a' };
  }

  /**
   * Hand the kind's colour to CSS in both forms it needs: the hex for solid
   * bits, and a bare "r,g,b" triplet that rgba() can take an alpha from. The
   * alpha itself lives in the stylesheet so a theme switch retunes it for free.
   */
  function rgbOf(hex) {
    var h = hex.replace('#', '');
    var n = parseInt(h.length === 3 ? h.replace(/./g, '$&$&') : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(',');
  }

  function paintMark(mark) {
    var k = kindOf(mark);
    var dark = k.colorDark || k.color;
    return '--mark:' + k.color + ';--mark-rgb:' + rgbOf(k.color)
      + ';--mark-d:' + dark + ';--mark-rgb-d:' + rgbOf(dark);
  }

  function markLabel(mark) { return mark.note || kindOf(mark).label; }

  function taskHtml(t) {
    var overdue = t.date && t.date < state.data.today;
    var meta = [];
    if (t.time) meta.push('<span class="time">' + t.time + '</span>');
    if (t.recurring) meta.push('↻');
    if (t.who) meta.push(esc(t.who));
    return '<li class="task' + (overdue ? ' overdue' : '') + '" data-url="' + esc(t.url) + '">'
      + '<span class="bar" style="background:var(--p' + t.priority + ')"></span>'
      + '<span class="body"><span class="txt">' + esc(t.content) + '</span>'
      + (meta.length ? '<span class="meta">' + meta.join(' · ') + '</span>' : '')
      + '</span></li>';
  }

  function listHtml(items, emptyText) {
    if (!items.length) return '<div class="empty">' + emptyText + '</div>';
    return '<ul>' + items.map(taskHtml).join('') + '</ul>';
  }

  function monthGrid() {
    var first = monthStart(state.anchor);
    var lead = dowMon(first);
    var days = new Date(Date.UTC(+first.slice(0, 4), +first.slice(5, 7), 0)).getUTCDate();
    var cells = [];

    for (var i = 0; i < lead; i++) cells.push('<div class="cell blank"></div>');
    for (var d = 1; d <= days; d++) {
      var day = first.slice(0, 8) + String(d).padStart(2, '0');
      var items = tasksOn(day);
      var mark = markOn(day);
      var cls = 'cell';
      if (mark) cls += ' marked mk';
      if (day === state.data.today) cls += ' today';
      if (day < state.data.today) cls += ' dim';
      var dots = items.slice(0, 4).map(function (t) {
        return '<span class="dot" style="background:var(--p' + t.priority + ')"></span>';
      }).join('');
      cells.push('<button class="' + cls + '" data-day="' + day + '"'
        + (mark ? ' style="' + paintMark(mark) + '" title="' + esc(markLabel(mark)) + '"' : '')
        + ' aria-pressed="' + (day === state.selected) + '">'
        + '<span>' + d + '</span>'
        + '<span class="dots">' + dots
        + (items.length > 4 ? '<span class="more">+' + (items.length - 4) + '</span>' : '')
        + '</span></button>');
    }

    var sel = state.selected;
    var below = sel
      ? '<div class="day-head' + (sel === state.data.today ? ' is-today' : '') + '">'
        + '<span class="d">' + longDate(sel) + '</span>'
        + '<span class="n">' + plural(tasksOn(sel).length) + '</span>'
        + chipHtml(markOn(sel))
        + '</div>'
        + listHtml(tasksOn(sel), 'Ничего не запланировано.')
      : '<div class="empty">Выбери день, чтобы посмотреть задачи.</div>';

    return '<div class="dow">' + DOW.map(function (w) { return '<div>' + w + '</div>'; }).join('')
      + '</div><div class="grid">' + cells.join('') + '</div>' + legendHtml() + below;
  }

  function chipHtml(mark) {
    if (!mark) return '';
    return '<span class="chip mk" style="' + paintMark(mark) + '">' + esc(markLabel(mark)) + '</span>';
  }

  /** Only the kinds actually shaded somewhere, so an unused colour never appears. */
  function legendHtml() {
    var seen = {};
    Object.keys(state.markByDate).forEach(function (d) { seen[state.markByDate[d].kind] = true; });
    var kinds = Object.keys(seen);
    if (!kinds.length) return '';
    return '<div class="legend">' + kinds.map(function (k) {
      var m = { kind: k };
      return '<span class="mk" style="' + paintMark(m) + '"><i></i>' + esc(kindOf(m).label) + '</span>';
    }).join('') + '</div>';
  }

  function weekList() {
    var start = weekStart(state.anchor);
    var out = [];
    for (var i = 0; i < 7; i++) {
      var day = addDays(start, i);
      var items = tasksOn(day);
      out.push('<div class="day-head' + (day === state.data.today ? ' is-today' : '') + '">'
        + '<span class="d">' + DOW[i] + ', ' + longDate(day) + '</span>'
        + '<span class="n">' + plural(items.length) + '</span>'
        + chipHtml(markOn(day))
        + '</div>'
        + listHtml(items, '—'));
    }
    return out.join('');
  }

  function plural(n) {
    if (!n) return 'пусто';
    var t = n % 10, h = n % 100;
    var word = (t === 1 && h !== 11) ? 'задача'
      : (t >= 2 && t <= 4 && (h < 12 || h > 14)) ? 'задачи' : 'задач';
    return n + ' ' + word;
  }
  function longDate(s) { return +s.slice(8, 10) + ' ' + MON[+s.slice(5, 7) - 1]; }
  function shortD(s) { return +s.slice(8, 10) + ' ' + SHORT[+s.slice(5, 7) - 1]; }

  function title() {
    if (state.view === 'month') {
      var m = MONN[+state.anchor.slice(5, 7) - 1];
      return m.charAt(0).toUpperCase() + m.slice(1) + ' ' + state.anchor.slice(0, 4);
    }
    var a = weekStart(state.anchor);
    return shortD(a) + ' — ' + shortD(addDays(a, 6));
  }

  function render() {
    var overdue = Object.keys(state.byDate)
      .filter(function (d) { return d < state.data.today; })
      .sort()
      .reduce(function (acc, d) { return acc.concat(state.byDate[d]); }, []);

    root.innerHTML =
      '<header>'
      + '<div class="seg">'
      + '<button data-view="month" aria-selected="' + (state.view === 'month') + '">Месяц</button>'
      + '<button data-view="week" aria-selected="' + (state.view === 'week') + '">Неделя</button>'
      + '</div>'
      + '<div class="nav">'
      + '<button data-step="-1" aria-label="Назад">‹</button>'
      + '<span class="title">' + title() + '</span>'
      + '<button data-step="1" aria-label="Вперёд">›</button>'
      + '<button class="today" data-step="0">Сегодня</button>'
      + '</div></header>'
      + (state.view === 'month' ? monthGrid() : weekList())
      + (overdue.length
        ? '<h2>⚠️ Просрочено <span class="count">· ' + overdue.length + '</span></h2>'
          + listHtml(overdue, '')
        : '')
      + (state.undated.length
        ? '<details class="undated"><summary>Без срока · ' + state.undated.length + '</summary>'
          + listHtml(state.undated, '') + '</details>'
        : '')
      + '<div class="foot"><a data-open="' + esc(state.data.project) + '">Открыть в Todoist</a></div>';

    if (tg && tg.BackButton) {
      if (state.view === 'month' && state.selected) tg.BackButton.show();
      else tg.BackButton.hide();
    }
  }

  // Step by month or by week depending on the current view; 0 jumps home.
  function step(n) {
    if (n === 0) {
      state.anchor = state.data.today;
      state.selected = state.view === 'month' ? state.data.today : null;
    } else if (state.view === 'month') {
      var d = parse(monthStart(state.anchor));
      d.setUTCMonth(d.getUTCMonth() + n);
      state.anchor = iso(d);
      state.selected = null;
    } else {
      state.anchor = addDays(weekStart(state.anchor), 7 * n);
    }
    render();
  }

  function openLink(url) {
    if (tg && tg.openLink) tg.openLink(url);
    else window.open(url, '_blank');
  }

  root.addEventListener('click', function (ev) {
    var el;
    if ((el = ev.target.closest('[data-view]'))) {
      state.view = el.dataset.view;
      if (state.view === 'month' && !state.selected) state.selected = state.data.today;
      return render();
    }
    if ((el = ev.target.closest('[data-step]'))) return step(+el.dataset.step);
    if ((el = ev.target.closest('[data-day]'))) {
      state.selected = state.selected === el.dataset.day ? null : el.dataset.day;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      return render();
    }
    if ((el = ev.target.closest('[data-url]'))) return openLink(el.dataset.url);
    if ((el = ev.target.closest('[data-open]'))) return openLink(el.dataset.open);
  });

  /**
   * Mirror the client's light/dark onto <html> and onto Telegram's own chrome.
   *
   * The --tg-theme-* values retarget themselves, so nothing here re-renders;
   * this only picks which fallback set applies, sets color-scheme so scrollbars
   * and the overscroll area follow, and repaints the native header and
   * background that sit outside the page.
   */
  function applyScheme() {
    if (!tg) return;
    if (tg.colorScheme) document.documentElement.setAttribute('data-scheme', tg.colorScheme);
    // Both methods are version-gated; older clients warn or throw rather than
    // no-op, and a missing header tint is not worth breaking the page over.
    try { tg.setBackgroundColor('bg_color'); } catch (e) {}
    try { tg.setHeaderColor('bg_color'); } catch (e) {}
  }

  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.BackButton) {
      tg.BackButton.onClick(function () { state.selected = null; render(); });
    }
    applyScheme();
    tg.onEvent('themeChanged', applyScheme);
  }

  load();
})();
</script>
</body>
</html>
