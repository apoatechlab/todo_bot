<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c0e">
<link rel="manifest" href="/wall.webmanifest">
<link rel="icon" href="/wall-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/wall-icon.png">
<title>Сегодня</title>
<style>
  /* A wall display, read from across the hallway. Dark on purpose: a lit white
     panel is a lamp in the evening, and on OLED black costs nothing. Every size
     is in vmin so the same page fills a small phone and a 13" tablet alike. */
  :root {
    color-scheme: dark;
    --bg: #0b0c0e;
    --text: #f2efe9;
    --muted: #8b8780;
    --faint: #3a3936;
    --accent: #e9b872;      /* times — warm, so they read as "when", not "alert" */
    --late: #e7836b;
    --font: -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; overflow: hidden; cursor: none;
    -webkit-user-select: none; user-select: none;
    /* Swipes are ours: no browser panning or pull-to-refresh to fight with. */
    touch-action: none; overscroll-behavior: none;
  }

  .wall {
    height: 100%;
    display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.25fr);
    gap: 6vmin;
    padding: calc(6vmin + env(safe-area-inset-top, 0px)) calc(6vmin + env(safe-area-inset-right, 0px))
             calc(6vmin + env(safe-area-inset-bottom, 0px)) calc(6vmin + env(safe-area-inset-left, 0px));
    /* A few pixels of drift every hour, so nothing sits on one spot for months. */
    transform: translate(var(--dx, 0px), var(--dy, 0px));
    transition: opacity .8s ease, transform .8s cubic-bezier(.2, .8, .2, 1);
  }
  @media (orientation: portrait) {
    .wall { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 5vmin; }
  }

  /* --- clock side --- */
  .clock { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .time {
    font-size: 25vmin; font-weight: 200; line-height: .9; letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
  }
  .time .colon { opacity: .55; }
  .date { margin-top: 3vmin; font-size: 5vmin; font-weight: 400; }
  .date .dow { display: block; color: var(--muted); font-size: 3.6vmin; margin-bottom: .6vmin; text-transform: lowercase; }
  .mark {
    margin-top: 3.5vmin; align-self: flex-start;
    font-size: 3vmin; padding: 1vmin 2.2vmin; border-radius: 999px;
    color: var(--mc, var(--accent)); border: .25vmin solid currentColor;
  }
  /* Weather sits under the clock: the same glance that asks "what time is it"
     asks "do I need a coat". Muted, so it never competes with the hour. */
  .wx { margin-top: 3vmin; font-size: 3vmin; color: var(--muted); line-height: 1.45; }
  .wx .t {
    color: var(--text); font-size: 4.6vmin; font-weight: 300;
    font-variant-numeric: tabular-nums;
  }
  .wx .sep { color: var(--faint); margin: 0 1.2vmin; }
  .wx .tm { display: flex; align-items: center; font-size: 2.6vmin; margin-top: .8vmin; }
  .wx .row { display: flex; align-items: center; }
  /* Line art, not emoji: emoji are colourful on a deliberately colourless page
     and are drawn differently on every device. A stroked glyph takes the page's
     own colour and scales with everything else. */
  .wi { flex: none; width: 6vmin; height: 6vmin; margin-right: 1.6vmin; color: var(--muted); }
  .tm .wi { width: 3.6vmin; height: 3.6vmin; margin-right: 1vmin; }
  .wi .sun { color: var(--accent); }
  .wi .drop { color: #7fa8c9; }
  .wi .flake { color: #a8c4d8; }
  .wi .bolt { color: var(--accent); }

  @media (orientation: portrait) {
    .clock { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 3vmin 4vmin; }
    .time { font-size: 22vmin; }
    .date { margin-top: 0; text-align: right; }
    .mark { margin-top: 0; justify-self: start; }
    /* The clock becomes a two-column grid here; weather spans it rather than
       being dealt into whichever cell happens to be free. */
    .wx { grid-column: 1 / -1; margin-top: 1vmin; }
  }

  /* --- tasks side --- */
  /* Two panes in one cell — today, and the rest of the week — crossfading. */
  .tasks { display: grid; min-height: 0; }
  .pane {
    grid-area: 1 / 1; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
    /* The incoming pane waits for the outgoing one to mostly fade, so the two
       never sit on top of each other half-visible; both moves are long and soft. */
    transition: opacity 2.2s cubic-bezier(.45, 0, .25, 1) 1.2s, transform 2.6s cubic-bezier(.3, 0, .2, 1) 1.2s;
  }
  .pane:not(.on) {
    opacity: 0; transform: translateY(1.2vmin);
    transition: opacity 1.6s cubic-bezier(.45, 0, .55, 1), transform 1.6s cubic-bezier(.45, 0, .55, 1);
  }
  @media (orientation: portrait) { .pane { justify-content: flex-start; padding-top: 4vmin; } }
  .head {
    display: flex; align-items: baseline; gap: 2vmin;
    font-size: 2.6vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 2.6vmin;
  }
  .head .n { color: var(--faint); font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0; padding: 0; min-height: 0; overflow: hidden; flex: 0 1 auto; }
  li {
    display: grid; grid-template-columns: 11vmin minmax(0, 1fr); align-items: baseline;
    padding: 1.7vmin 0; border-top: .15vmin solid var(--faint);
  }
  li:first-child { border-top: 0; }
  .at {
    font-size: 3.6vmin; font-weight: 500; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .at.none { color: var(--faint); }
  .what { font-size: 4.4vmin; line-height: 1.15; overflow-wrap: anywhere; }
  .who { color: var(--muted); font-size: 3vmin; margin-left: 1.4vmin; white-space: nowrap; }
  li.past .what, li.past .at { opacity: .38; }
  .more { margin-top: 1.6vmin; font-size: 2.8vmin; color: var(--muted); padding-left: 11vmin; }

  .late { margin-top: 4vmin; }
  .late .head { color: var(--late); margin-bottom: 1.4vmin; }
  .late li { padding: 1vmin 0; border: 0; }
  .late .what { font-size: 3.2vmin; color: var(--text); opacity: .8; }
  .late .at { font-size: 2.6vmin; color: var(--late); }

  .next { margin-top: 4vmin; font-size: 2.8vmin; color: var(--muted); line-height: 1.5; }
  .next b { font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 2.3vmin; margin-right: 1.4vmin; }

  .free { font-size: 6vmin; font-weight: 300; color: var(--muted); }

  /* --- the rest of the week, peeking in --- */
  .day + .day { margin-top: 2.6vmin; }
  .dlabel { font-size: 2.7vmin; color: var(--muted); margin-bottom: .4vmin; }
  .dlabel .mk { color: var(--mc, var(--accent)); margin-left: 1.2vmin; }
  .day li { padding: .9vmin 0; border: 0; }
  .day .what { font-size: 3.7vmin; }
  .day .at { font-size: 3vmin; }
  .pane .more:empty { display: none; }

  /* --- week view, swiped in --- */
  .week {
    position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
    padding: calc(5vmin + env(safe-area-inset-top, 0px)) calc(4vmin + env(safe-area-inset-right, 0px))
             calc(4vmin + env(safe-area-inset-bottom, 0px)) calc(4vmin + env(safe-area-inset-left, 0px));
    transform: translateX(var(--from, 100%)); opacity: 0; pointer-events: none;
    transition: transform .8s cubic-bezier(.2, .8, .2, 1), opacity .8s ease;
  }
  .week.open { transform: none; opacity: 1; pointer-events: auto; }
  body.week-open .wall { opacity: 0; transform: translateX(var(--away, -6vmin)); }
  .wk-head { display: flex; align-items: baseline; gap: 2.4vmin; margin-bottom: 3vmin; }
  .wk-head b { font-size: 2.6vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .wk-head span { font-size: 3.6vmin; }
  .wk-head i { margin-left: auto; font-style: normal; font-size: 2vmin; color: var(--faint); }
  .wk { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1.4vmin; }
  .col {
    min-height: 0; overflow: hidden; display: flex; flex-direction: column;
    padding: 2vmin 1.6vmin; border-radius: 2vmin; background: rgba(255, 255, 255, .035);
  }
  .col.today { background: rgba(233, 184, 114, .09); box-shadow: inset 0 0 0 .22vmin rgba(233, 184, 114, .55); }
  .col.past { opacity: .4; }
  .cd { display: flex; align-items: baseline; gap: 1vmin; }
  .cd small { font-size: 2vmin; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .cd span { font-size: 4.6vmin; font-weight: 300; font-variant-numeric: tabular-nums; }
  .col.today .cd small { color: var(--accent); }
  .cm { margin-top: .8vmin; font-size: 1.8vmin; color: var(--mc, var(--accent)); }
  .col ul { margin-top: 1.2vmin; }
  .col li { display: block; padding: .9vmin 0; border-top: .12vmin solid var(--faint); }
  .col li:first-child { border-top: 0; }
  .col .at { display: block; font-size: 1.9vmin; }
  .col .what { display: block; font-size: 2.3vmin; line-height: 1.2; }
  .col .who { display: block; margin: .2vmin 0 0; font-size: 1.8vmin; }
  .col .empty { margin-top: 1.4vmin; font-size: 2vmin; color: var(--faint); }
  .col .more { margin-top: auto; padding: .8vmin 0 0; font-size: 1.8vmin; }
  .col .more:empty { display: none; }
  @media (orientation: portrait) {
    .wk { grid-template-columns: 1fr; grid-auto-rows: minmax(0, auto); gap: 1vmin; overflow: hidden; }
    .col { display: grid; grid-template-columns: 14vmin minmax(0, 1fr); align-items: start; padding: 1.4vmin 2vmin; }
    .cd { flex-direction: column; gap: 0; }
    .cd { grid-column: 1; grid-row: 1; }
    .cm { grid-column: 1; grid-row: 2; }
    .col ul, .col .empty { grid-column: 2; grid-row: 1 / span 3; margin-top: 0; }
    .col .more { grid-column: 2; grid-row: 4; margin-top: 0; }
  }

  /* --- states --- */
  .status {
    position: fixed; right: calc(2.4vmin + env(safe-area-inset-right, 0px));
    bottom: calc(2.4vmin + env(safe-area-inset-bottom, 0px));
    font-size: 2vmin; color: var(--muted);
  }
  .gate {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 8vmin; font-size: 3.4vmin; color: var(--muted); line-height: 1.5; background: var(--bg);
  }
  .gate b { color: var(--text); font-weight: 500; display: block; font-size: 4.6vmin; margin-bottom: 2vmin; }
  .wake {
    position: fixed; inset: 0; display: grid; place-items: end center; padding-bottom: 8vmin;
    background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 2.6vmin; cursor: pointer;
  }

  /* --- kitchen timer --- */
  /* A quiet corner button: the hours it is not needed it should not be seen
     from the hallway. Running, it becomes the countdown itself. */
  .tbtn {
    position: fixed; z-index: 5;
    left: calc(4vmin + env(safe-area-inset-left, 0px)); bottom: calc(3.4vmin + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 1.4vmin;
    padding: 1.6vmin 2.4vmin; border-radius: 999px; border: .2vmin solid var(--faint);
    background: transparent; color: var(--muted); font: inherit; font-size: 2.6vmin; cursor: pointer;
    transition: color .4s ease, border-color .4s ease, opacity 2.5s ease;
  }
  .tbtn svg { width: 3.4vmin; height: 3.4vmin; }
  .tbtn.run { color: var(--accent); border-color: rgba(233, 184, 114, .45); font-size: 4.4vmin;
    font-variant-numeric: tabular-nums; padding: 1.4vmin 3vmin; }
  .tbtn.run svg { width: 4.4vmin; height: 4.4vmin; }
  @media (orientation: portrait) {
    .tbtn { bottom: auto; left: auto;
      top: calc(4vmin + env(safe-area-inset-top, 0px)); right: calc(4vmin + env(safe-area-inset-right, 0px)); }
  }
  body.night:not(.awake) .tbtn:not(.run) { opacity: 0; pointer-events: none; }

  .tsheet {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    background: rgba(11, 12, 14, .86); -webkit-backdrop-filter: blur(1.2vmin); backdrop-filter: blur(1.2vmin);
    opacity: 0; pointer-events: none; transition: opacity .5s ease;
  }
  .tsheet.open { opacity: 1; pointer-events: auto; }
  .tpanel { width: min(92vw, 110vmin); text-align: center; }
  .tpanel h2 { margin: 0 0 4vmin; font-size: 3vmin; font-weight: 500; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted); }
  .tgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2.4vmin; }
  @media (orientation: portrait) { .tgrid { grid-template-columns: repeat(4, 1fr); } }
  .tgrid button, .tstep button, .tact button {
    font: inherit; color: var(--text); background: rgba(255, 255, 255, .04);
    border: .2vmin solid var(--faint); border-radius: 2.4vmin; cursor: pointer;
  }
  .tgrid button { padding: 3vmin 0; font-size: 5vmin; font-weight: 300; font-variant-numeric: tabular-nums; }
  .tgrid button small { display: block; font-size: 2.2vmin; color: var(--muted); margin-top: .6vmin; }
  .tgrid button:active, .tstep button:active, .tact button:active { background: rgba(233, 184, 114, .16); }
  .tstep { display: flex; align-items: center; justify-content: center; gap: 3vmin; margin-top: 4vmin; }
  .tstep button { width: 10vmin; height: 10vmin; font-size: 5vmin; }
  .tstep .n { min-width: 22vmin; font-size: 7vmin; font-weight: 200; font-variant-numeric: tabular-nums; }
  .tstep .n small { font-size: 2.6vmin; color: var(--muted); margin-left: 1vmin; }
  .tact { display: flex; justify-content: center; gap: 3vmin; margin-top: 4vmin; }
  .tact button { padding: 2.2vmin 5vmin; font-size: 3.2vmin; }
  .tact .go { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .tact .no { color: var(--late); }
  .tleft { font-size: 16vmin; font-weight: 200; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }

  /* Time's up: the whole screen, so it is seen from the stove. */
  .tring {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; align-content: center;
    gap: 5vmin; background: var(--bg); text-align: center; cursor: pointer;
  }
  .tring .big { font-size: 13vmin; font-weight: 200; color: var(--accent); animation: tpulse 1.6s ease-in-out infinite; }
  .tring .sub { font-size: 3.4vmin; color: var(--muted); }
  .tring button { font: inherit; font-size: 4vmin; padding: 2.4vmin 9vmin; border-radius: 999px;
    color: var(--bg); background: var(--accent); border: 0; cursor: pointer; }
  @keyframes tpulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.97); } }

  /* Night: plain black, so the hallway stays dark. A touch brings the page back
     for half a minute, so a dark screen never looks broken. */
  body.night:not(.awake) .wall, body.night:not(.awake) .week, body.night:not(.awake) .wake {
    opacity: 0 !important; pointer-events: none; transition: opacity 2.5s ease;
  }
</style>
</head>
<body>
<main class="wall" id="wall">
  <section class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
    <div class="mark" id="mark" hidden></div>
    <div class="wx" id="wx" hidden></div>
  </section>
  <section class="tasks" id="tasks"></section>
</main>
<section class="week" id="week" aria-hidden="true"></section>
<div class="status" id="status" hidden></div>
<div class="gate" id="gate" hidden></div>
<button class="tbtn timer-ui" id="tbtn" aria-label="Таймер"></button>
<section class="tsheet timer-ui" id="tsheet" aria-hidden="true"></section>
<section class="tring timer-ui" id="tring" hidden></section>
<button class="wake" id="wake" hidden>Коснитесь, чтобы экран не гас</button>

<script>
(function () {
  'use strict';

  var REFRESH_MS = 60 * 1000;   // backstop; the bot's changes arrive over the socket
  var NIGHT_FROM = 23 * 60, NIGHT_TO = 6 * 60 + 30;   // local minutes
  var PEEK_EVERY = 20 * 1000, PEEK_FOR = 9 * 1000;    // "ещё на этой неделе"
  var WEEK_IDLE = 30 * 1000;                          // week view, untouched, goes home

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // The key arrives once in the link and is kept, so a bookmark or a home-screen
  // icon saved without it still opens the wall.
  var params = new URLSearchParams(location.search);
  var key = params.get('k') || store.get('wall:key') || '';
  if (params.get('k')) store.set('wall:key', key);

  var state = { tz: 'Europe/Madrid', data: null, failedAt: 0, pane: 'today', hasNext: false, weekOpen: false };

  /* ------------------------------------------------------------ clock --- */
  // Shown in the family's zone, not the tablet's: a tablet that drifted to the
  // wrong zone must not quietly move every appointment on the wall.
  function parts(now) {
    var f = new Intl.DateTimeFormat('ru-RU', {
      timeZone: state.tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
    });
    var p = {};
    f.formatToParts(now).forEach(function (x) { p[x.type] = x.value; });
    var iso = new Intl.DateTimeFormat('en-CA', {
      timeZone: state.tz, year: 'numeric', month: '2-digit', day: '2-digit',
    }).format(now);
    return { h: p.hour, m: p.minute, dow: p.weekday, day: p.day, month: p.month, iso: iso };
  }

  function tick() {
    var p = parts(new Date());
    $('time').innerHTML = p.h + '<span class="colon">:</span>' + p.m;
    $('date').innerHTML = '<span class="dow">' + esc(p.dow) + '</span>' + esc(p.day + ' ' + p.month);

    var mins = +p.h * 60 + +p.m;
    document.body.classList.toggle('night', mins >= NIGHT_FROM || mins < NIGHT_TO);

    // Past events dim as the day goes; a new day means fresh data, not a stale list.
    if (state.data) {
      if (state.data.today !== p.iso) load();
      else markPast(p.h + ':' + p.m);
    }
  }

  function markPast(hhmm) {
    var rows = document.querySelectorAll('#today li[data-at]');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('past', rows[i].getAttribute('data-at') < hhmm);
    }
  }

  function drift() {
    var h = new Date().getHours();
    var w = $('wall');
    w.style.setProperty('--dx', ((h * 7) % 9 - 4) + 'px');
    w.style.setProperty('--dy', ((h * 5) % 9 - 4) + 'px');
  }

  /* ------------------------------------------------------------- data --- */
  function load() {
    if (!key) return gate('Нужна ссылка с ключом', 'Откройте адрес вида /wall?k=…<br>Ключ — это WALL_KEY бота.');
    fetch('/api/wall?k=' + encodeURIComponent(key), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (res) {
        if (!res.ok) {
          if (res.status === 403 || res.status === 503) return gate('Нет доступа', esc(res.j.error || ''));
          throw new Error(res.j.error || res.status);
        }
        $('gate').hidden = true;
        state.data = res.j;
        state.tz = res.j.tz || state.tz;
        state.failedAt = 0;
        $('status').hidden = true;
        render();
        tick();
      })
      .catch(function () {
        // Keep the last good list on the wall; just admit it may be old.
        if (!state.failedAt) state.failedAt = Date.now();
        if (Date.now() - state.failedAt > 3 * REFRESH_MS) {
          $('status').textContent = 'нет связи';
          $('status').hidden = false;
        }
      });
  }

  function gate(title, body) {
    $('gate').innerHTML = '<div><b>' + title + '</b>' + body + '</div>';
    $('gate').hidden = false;
  }

  /* ----------------------------------------------------------- render --- */
  function row(t, cls) {
    return '<li class="' + (cls || '') + '"' + (t.time ? ' data-at="' + t.time + '"' : '') + '>'
      + '<span class="at' + (t.time ? '' : ' none') + '">' + (t.time || '·') + '</span>'
      + '<span class="what">' + esc(t.content)
      + (t.who ? '<span class="who">' + esc(t.who) + '</span>' : '') + '</span></li>';
  }

  function shortDay(iso) {
    var d = new Date(iso + 'T12:00:00Z');
    return new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short', timeZone: 'UTC' })
      .format(d).replace('.', '');
  }

  var DOW = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var DOW_LONG = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
  var dowOf = function (iso) { return new Date(iso + 'T12:00:00Z').getUTCDay(); };
  var dayNum = function (iso) { return +iso.slice(8, 10); };
  function monthName(iso) {
    return new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', timeZone: 'UTC' })
      .format(new Date(iso + 'T12:00:00Z')).replace(/^\d+\s*/, '');
  }

  /* Stroked at 24x24, inheriting currentColor so the page's palette drives it.
     Parts that earn a colour of their own — the sun, drops, flakes, the bolt —
     carry a class and take it from CSS. */
  var ICONS = {
    clear:
      '<circle cx="12" cy="12" r="4.2" class="sun"/>'
      + '<g class="sun"><path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4'
      + 'M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M18.9 5.1l-1.7 1.7M6.8 17.2l-1.7 1.7"/></g>',
    moon:
      '<path class="sun" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',
    partly:
      '<g class="sun"><circle cx="8.6" cy="8" r="3.1"/>'
      + '<path d="M8.6 1.9v1.6M2.5 8h1.6M4.3 3.7l1.1 1.1M12.9 3.7l-1.1 1.1"/></g>'
      + '<path d="M8.2 20.5h8.9a3.7 3.7 0 0 0 .4-7.3 5.2 5.2 0 0 0-9.9-.7 3.8 3.8 0 0 0 .6 8z"/>',
    partlyNight:
      '<path class="sun" d="M13.6 9.4A5.4 5.4 0 0 1 7 2.9a5.4 5.4 0 1 0 6.6 6.5z"/>'
      + '<path d="M8.2 20.5h8.9a3.7 3.7 0 0 0 .4-7.3 5.2 5.2 0 0 0-9.9-.7 3.8 3.8 0 0 0 .6 8z"/>',
    cloud:
      '<path d="M7.4 19.5h9.8a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.7-.8 4.1 4.1 0 0 0 .5 8.8z"/>',
    fog:
      '<path d="M7.4 15.2h9.8a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.7-.8 4.1 4.1 0 0 0 .5 8.8z"/>'
      + '<path d="M4.5 18.6h15M7 21.6h10"/>',
    rain:
      '<path d="M7.4 15.4h9.8a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.7-.8 4.1 4.1 0 0 0 .5 8.8z"/>'
      + '<g class="drop"><path d="M9 18.3l-1.2 3M13 18.3l-1.2 3M17 18.3l-1.2 3"/></g>',
    snow:
      '<path d="M7.4 15.4h9.8a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.7-.8 4.1 4.1 0 0 0 .5 8.8z"/>'
      + '<g class="flake"><path d="M8.4 18.4v3M7.1 19.2l2.6 1.5M9.7 19.2l-2.6 1.5'
      + 'M15.6 18.4v3M14.3 19.2l2.6 1.5M16.9 19.2l-2.6 1.5"/></g>',
    storm:
      '<path d="M7.4 14.6h9.8a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.7-.8 4.1 4.1 0 0 0 .5 8.8z"/>'
      // Kept clear of y=24: at stroke-width 1.5 the old tip was shaved flat by
      // the edge of the viewBox.
      + '<path class="bolt" d="M13.4 15.5L10.2 19.4h2.6L10.9 22.1"/>',
  };

  /**
   * `night` only swaps the two shapes a sun belongs to. Rain is rain after dark.
   */
  function iconHtml(key, night) {
    var k = key;
    if (night && key === 'clear') k = 'moon';
    if (night && key === 'partly') k = 'partlyNight';
    if (!ICONS[k]) return '';
    return '<svg class="wi" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"'
      + ' aria-hidden="true">' + ICONS[k] + '</svg>';
  }

  /** Temperature now, the day's range, and a word about tomorrow. */
  function renderWeather(w) {
    var el = $('wx');
    if (!w || w.now === null || w.now === undefined) { el.hidden = true; return; }

    var line = iconHtml(w.icon, w.day === false)
      + '<span class="t">' + w.now + '°</span>';
    if (w.text) line += '<span class="sep">·</span>' + esc(w.text);

    var t = w.today;
    // The range is only worth the width once the day has somewhere left to go.
    if (t && t.high !== null && t.low !== null) {
      line += '<span class="sep">·</span>' + t.high + '° / ' + t.low + '°';
    }
    var out = '<div class="row">' + line + '</div>';

    var n = w.tomorrow;
    if (n && n.high !== null) {
      out += '<div class="tm">' + iconHtml(n.icon, false) + '<span>завтра ' + n.high + '°'
        + (n.low !== null ? ' / ' + n.low + '°' : '')
        + (n.text ? ', ' + esc(n.text) : '') + '</span></div>';
    }

    el.innerHTML = out;
    el.hidden = false;
  }

  function render() {
    var d = state.data;

    var m = d.mark;
    $('mark').hidden = !m;
    if (m) {
      $('mark').textContent = m.label + (m.note ? ' · ' + m.note : '');
      $('mark').style.setProperty('--mc', m.color || '');
    }

    renderWeather(d.weather);

    var next = nextHtml();
    state.hasNext = !!next;
    if (!next && state.pane === 'next') state.pane = 'today';
    $('tasks').innerHTML =
      '<div class="pane' + (state.pane === 'today' ? ' on' : '') + '" id="pToday">' + todayHtml() + '</div>'
      + '<div class="pane' + (state.pane === 'next' ? ' on' : '') + '" id="pNext">' + next + '</div>';

    var p = parts(new Date());
    markPast(p.h + ':' + p.m);
    fitToday();
    fitNext();
    if (state.weekOpen) renderWeek();
  }

  function todayHtml() {
    var d = state.data, out = [];
    out.push(d.tasks.length
      ? '<div class="head">Сегодня <span class="n">' + d.tasks.length + '</span></div>'
        + '<ul id="today">' + d.tasks.map(function (t) { return row(t); }).join('') + '</ul><div class="more" id="more" hidden></div>'
      : '<div class="free">Сегодня свободно</div>');

    if (d.overdue.length) {
      var late = d.overdue.slice(0, 3);
      out.push('<div class="late"><div class="head">Просрочено <span class="n">' + d.overdue.length + '</span></div><ul>'
        + late.map(function (t) { return row({ content: t.content, who: t.who, time: shortDay(t.date) }); }).join('')
        + '</ul></div>');
    }

    var tm = d.tomorrowMark;
    if (d.tomorrow.length || tm) {
      var bits = d.tomorrow.slice(0, 3).map(function (t) {
        return (t.time ? t.time + ' ' : '') + esc(t.content);
      });
      if (d.tomorrow.length > 3) bits.push('ещё ' + (d.tomorrow.length - 3));
      if (tm) bits.unshift(esc(tm.label));
      out.push('<div class="next"><b>Завтра</b>' + bits.join(' · ') + '</div>');
    }
    return out.join('');
  }

  /**
   * The days after today up to Sunday. On Saturday and Sunday there is too
   * little of the week left to be worth a look, so it is next week instead.
   * Empty days are skipped; with nothing at all, there is no peek.
   */
  function nextHtml() {
    var d = state.data, days = d.days || [];
    var i = days.findIndex(function (x) { return x.date === d.today; });
    if (i < 0) return '';
    var title = 'Ещё на этой неделе', pick = days.slice(i + 1, 7);
    if (i >= 5) { title = 'На следующей неделе'; pick = days.slice(7, 14); }
    pick = pick.filter(function (x) { return x.tasks.length || x.mark; });
    if (!pick.length) return '';
    return '<div class="head">' + title + '</div>'
      + pick.map(function (x) {
        return '<div class="day"><div class="dlabel">' + DOW_LONG[dowOf(x.date)] + ', ' + dayNum(x.date)
          + (x.mark ? '<span class="mk" style="--mc:' + esc(x.mark.color || '') + '">' + esc(x.mark.label) + '</span>' : '')
          + '</div><ul>' + x.tasks.map(function (t) { return row(t); }).join('') + '</ul></div>';
      }).join('')
      + '<div class="more"></div>';
  }

  // A long day must not spill off the screen or end on half a line. Rows go
  // until it fits — what is already over first, since that matters least now,
  // then from the end — and the count of what went is said underneath.
  function fitToday() {
    var list = $('today'), more = $('more'), pane = $('pToday');
    if (!list) return;
    var hidden = 0;
    var over = function () {
      return list.scrollHeight > list.clientHeight + 1 || pane.scrollHeight > pane.clientHeight + 1;
    };
    while (over() && list.children.length > 1) {
      list.removeChild(list.querySelector('li.past') || list.lastElementChild);
      hidden++;
      more.textContent = 'и ещё ' + hidden;
      more.hidden = false;
    }
  }

  /** Same for the peek: drop from the far end of the week, whole days when emptied. */
  function fitNext() {
    var pane = $('pNext'), more = pane && pane.querySelector('.more');
    if (!more) return;
    var hidden = 0;
    while (pane.scrollHeight > pane.clientHeight + 1) {
      var lis = pane.querySelectorAll('.day li');
      if (lis.length <= 1) break;
      var li = lis[lis.length - 1], ul = li.parentNode;
      ul.removeChild(li);
      if (!ul.children.length) ul.parentNode.parentNode.removeChild(ul.parentNode);
      hidden++;
      more.textContent = 'и ещё ' + hidden;
    }
  }

  /* ------------------------------------------------------------- peek --- */
  // Every 20 s the right side turns to the rest of the week for a few seconds,
  // then back — so a glance from the hallway catches tomorrow's dentist too.
  var peekBack = null;
  function show(name) {
    state.pane = name;
    var a = $('pToday'), b = $('pNext');
    if (a) a.classList.toggle('on', name === 'today');
    if (b) b.classList.toggle('on', name === 'next');
  }
  function peek() {
    if (!state.data || !state.hasNext || state.weekOpen) return;
    show('next');
    clearTimeout(peekBack);
    peekBack = setTimeout(function () { show('today'); }, PEEK_FOR);
  }

  /* ------------------------------------------------------------- week --- */
  // A swipe brings in the whole week, Monday to Sunday. Left alone for 30 s
  // it slides back out, so the wall never stays stuck on it.
  var weekIdle = null;
  function renderWeek() {
    var d = state.data, days = (d.days || []).slice(0, 7);
    if (!days.length) return;
    var a = days[0].date, b = days[6].date;
    var range = monthName(a) === monthName(b)
      ? dayNum(a) + ' – ' + dayNum(b) + ' ' + monthName(b)
      : dayNum(a) + ' ' + monthName(a) + ' – ' + dayNum(b) + ' ' + monthName(b);
    $('week').innerHTML = '<div class="wk-head"><b>Неделя</b><span>' + range + '</span><i>смахните, чтобы вернуться</i></div>'
      + '<div class="wk">' + days.map(function (x) {
        var cls = 'col' + (x.date === d.today ? ' today' : x.date < d.today ? ' past' : '');
        return '<div class="' + cls + '"><div class="cd"><small>' + DOW[dowOf(x.date)] + '</small><span>' + dayNum(x.date) + '</span></div>'
          + (x.mark ? '<div class="cm" style="--mc:' + esc(x.mark.color || '') + '">' + esc(x.mark.label) + '</div>' : '')
          + (x.tasks.length
            ? '<ul>' + x.tasks.map(function (t) {
              return '<li>' + (t.time ? '<span class="at">' + t.time + '</span>' : '')
                + '<span class="what">' + esc(t.content) + '</span>'
                + (t.who ? '<span class="who">' + esc(t.who) + '</span>' : '') + '</li>';
            }).join('') + '</ul><div class="more"></div>'
            : '<div class="empty">—</div>')
          + '</div>';
      }).join('') + '</div>';
    fitWeek();
  }

  // Each column keeps what fits and counts the rest; in portrait, where days
  // stack, the fullest day gives way until the week fits the screen.
  function fitWeek() {
    var cols = [].slice.call(document.querySelectorAll('#week .col'));
    var cut = function (col) {
      var ul = col.querySelector('ul');
      if (!ul || ul.children.length <= 1) return false;
      ul.removeChild(ul.lastElementChild);
      var more = col.querySelector('.more');
      more.textContent = '+' + (+(more.getAttribute('data-n') || 0) + 1);
      more.setAttribute('data-n', more.textContent.slice(1));
      return true;
    };
    cols.forEach(function (col) {
      while (col.scrollHeight > col.clientHeight + 1 && cut(col)) {}
    });
    var wk = document.querySelector('#week .wk');
    while (wk && wk.scrollHeight > wk.clientHeight + 1) {
      var fullest = cols.slice().sort(function (x, y) {
        return y.querySelectorAll('li').length - x.querySelectorAll('li').length;
      })[0];
      if (!fullest || !cut(fullest)) break;
    }
  }

  function openWeek(fromLeft) {
    if (!state.data) return;
    state.weekOpen = true;
    clearTimeout(peekBack);
    show('today');
    var w = $('week');
    w.style.setProperty('--from', fromLeft ? '-100%' : '100%');
    $('wall').style.setProperty('--away', fromLeft ? '6vmin' : '-6vmin');
    renderWeek();
    // Commit the starting edge before sliding, or it would jump straight in.
    void w.offsetWidth;
    w.classList.add('open');
    w.setAttribute('aria-hidden', 'false');
    document.body.classList.add('week-open');
    poke();
  }

  function closeWeek(toLeft) {
    state.weekOpen = false;
    clearTimeout(weekIdle);
    var w = $('week');
    if (toLeft !== undefined) w.style.setProperty('--from', toLeft ? '-100%' : '100%');
    w.classList.remove('open');
    w.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('week-open');
  }

  var nightPeek = null;
  function poke() {
    if (document.body.classList.contains('night')) {
      document.body.classList.add('awake');
      clearTimeout(nightPeek);
      nightPeek = setTimeout(function () { document.body.classList.remove('awake'); }, WEEK_IDLE);
    }
    if (!state.weekOpen) return;
    clearTimeout(weekIdle);
    weekIdle = setTimeout(function () { closeWeek(); }, WEEK_IDLE);
  }

  // Either direction opens it, following the finger; either direction closes.
  var sx = null, sy = null, dark = false;
  document.addEventListener('pointerdown', function (e) {
    var b = document.body.classList;
    dark = b.contains('night') && !b.contains('awake');   // the first touch at night only wakes the page
    poke();
    if (e.target.closest && e.target.closest('.timer-ui')) { sx = null; return; }   // taps on the timer are not swipes
    sx = e.clientX; sy = e.clientY;
  });
  document.addEventListener('pointerup', function (e) {
    if (sx === null || dark) { sx = null; return; }
    var dx = e.clientX - sx, dy = e.clientY - sy;
    sx = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
    if (state.weekOpen) closeWeek(dx < 0);
    else openWeek(dx > 0);
  });
  document.addEventListener('pointercancel', function () { sx = null; });

  /* ------------------------------------------------------------ timer --- */
  // A kitchen timer: pick minutes, and when they are up the whole screen says
  // so and a bell rings until someone taps. The end time is kept, so a reload
  // or a dropped connection does not lose a running timer.
  var T_PRESETS = [1, 2, 3, 5, 7, 8, 10, 15, 20, 30, 45, 60];
  var T_RING_MAX = 2 * 60 * 1000;               // nobody home: stop after two minutes
  var ICON_TIMER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" '
    + 'stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/>'
    + '<path d="M12 13.5V9.5M9.5 2.5h5M12 2.5v3.5M18.6 6.4l1.4-1.4"/></svg>';
  var timer = { end: 0, mins: 0, tick: null, ringStop: null, step: 5, sheetIdle: null };

  // Browsers only let a page make sound after a touch, so the audio context is
  // made (or woken) on the touches that set a timer, and kept for the bell.
  var audio = null, bell = null;
  function ac() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
    return audio;
  }
  // One struck note: a bright sine with a quiet inharmonic overtone, a fast
  // attack and a short ring, like a small metal bar.
  function ping(t, f, g, out) {
    [[f, 1, .34], [f * 2.76, .22, .12]].forEach(function (p) {
      var o = audio.createOscillator(), v = audio.createGain();
      o.type = 'sine';
      o.frequency.value = p[0];
      v.gain.setValueAtTime(0.0001, t);
      v.gain.exponentialRampToValueAtTime(g * p[1], t + 0.006);
      v.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);
      o.connect(v); v.connect(out);
      o.start(t); o.stop(t + p[2] + 0.05);
    });
  }
  // The bell: quick high pairs in a loop, getting louder over the first few
  // bars — in the spirit of the classic phone timer, not a copy of it.
  function bellStart() {
    var a = ac();
    if (!a || bell) return;
    var out = a.createGain();
    out.connect(a.destination);
    var bar = 0;
    function play() {
      var t = a.currentTime + 0.05, g = Math.min(0.75, 0.25 + bar * 0.1);
      [1760, 1318.5, 1760, 1318.5, 1760, 1318.5].forEach(function (f, i) { ping(t + i * 0.1, f, g, out); });
      bar++;
    }
    play();
    bell = { out: out, loop: setInterval(play, 1300) };
  }
  function bellStop() {
    if (!bell) return;
    clearInterval(bell.loop);
    var out = bell.out;
    bell = null;
    try { out.gain.setTargetAtTime(0.0001, audio.currentTime, 0.03); } catch (e) {}
    setTimeout(function () { try { out.disconnect(); } catch (e) {} }, 400);
  }

  function fmtLeft(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
    return h ? h + ':' + p2(m) + ':' + p2(x) : m + ':' + p2(x);
  }
  function tSave() {
    store.set('wall:timer', timer.end ? JSON.stringify({ end: timer.end, mins: timer.mins }) : '');
  }
  function tRender() {
    var b = $('tbtn'), left = timer.end - Date.now(), run = timer.end && left > 0;
    b.classList.toggle('run', !!run);
    b.innerHTML = ICON_TIMER + '<span>' + (run ? fmtLeft(left) : 'Таймер') + '</span>';
    var l = $('tsLeft');
    if (l) l.textContent = fmtLeft(left);
  }
  function tTick() {
    if (timer.end && Date.now() >= timer.end) tRing();
    tRender();
  }
  function tRun() {
    clearInterval(timer.tick);
    timer.tick = setInterval(tTick, 250);
    tTick();
  }
  function tStart(mins) {
    timer.mins = mins;
    timer.end = Date.now() + mins * 60 * 1000;
    tSave();
    tClose();
    tRun();
  }
  function tCancel() {
    timer.end = 0;
    clearInterval(timer.tick);
    tSave();
    tRender();
  }
  function tRing() {
    var mins = timer.mins;
    tCancel();
    var r = $('tring');
    r.innerHTML = '<div class="big">Время вышло</div>'
      + '<div class="sub">Таймер на ' + mins + ' мин</div><button>Стоп</button>';
    r.hidden = false;
    poke();                                     // at night, show the page behind it too
    bellStart();
    clearTimeout(timer.ringStop);
    timer.ringStop = setTimeout(tSilence, T_RING_MAX);
  }
  function tSilence() {
    $('tring').hidden = true;
    clearTimeout(timer.ringStop);
    bellStop();
  }

  function tOpen() {
    var sh = $('tsheet');
    if (timer.end > Date.now()) {
      sh.innerHTML = '<div class="tpanel"><h2>Таймер на ' + timer.mins + ' мин</h2>'
        + '<div class="tleft" id="tsLeft">' + fmtLeft(timer.end - Date.now()) + '</div>'
        + '<div class="tact"><button data-t="add">+1 мин</button>'
        + '<button class="no" data-t="cancel">Отменить</button><button data-t="close">Закрыть</button></div></div>';
    } else {
      sh.innerHTML = '<div class="tpanel"><h2>Таймер</h2><div class="tgrid">'
        + T_PRESETS.map(function (m) {
          return '<button data-m="' + m + '">' + (m === 60 ? '1<small>час</small>' : m + '<small>мин</small>') + '</button>';
        }).join('')
        + '</div><div class="tstep"><button data-t="minus" aria-label="меньше">−</button>'
        + '<div class="n"><span id="tsN">' + timer.step + '</span><small>мин</small></div>'
        + '<button data-t="plus" aria-label="больше">+</button></div>'
        + '<div class="tact"><button class="go" data-t="go">Старт</button><button data-t="close">Закрыть</button></div></div>';
    }
    sh.classList.add('open');
    sh.setAttribute('aria-hidden', 'false');
    tIdle();
  }
  function tClose() {
    var sh = $('tsheet');
    sh.classList.remove('open');
    sh.setAttribute('aria-hidden', 'true');
    clearTimeout(timer.sheetIdle);
    setTimeout(function () { if (!sh.classList.contains('open')) sh.innerHTML = ''; }, 600);
  }
  function tIdle() {                            // an untouched sheet goes away like the week does
    clearTimeout(timer.sheetIdle);
    timer.sheetIdle = setTimeout(tClose, WEEK_IDLE);
  }

  $('tbtn').addEventListener('click', function () { ac(); tOpen(); });
  $('tring').addEventListener('click', tSilence);
  $('tsheet').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    tIdle();
    if (!b) { if (e.target === this) tClose(); return; }   // the dark around the panel
    ac();
    if (b.dataset.m) { tStart(+b.dataset.m); return; }
    switch (b.dataset.t) {
      case 'go': tStart(timer.step); break;
      case 'minus': timer.step = Math.max(1, timer.step - (timer.step > 10 ? 5 : 1)); $('tsN').textContent = timer.step; break;
      case 'plus': timer.step = Math.min(180, timer.step + (timer.step >= 10 ? 5 : 1)); $('tsN').textContent = timer.step; break;
      case 'add': timer.end += 60 * 1000; timer.mins += 1; tSave(); tRender(); break;
      case 'cancel': tCancel(); tClose(); break;
      case 'close': tClose(); break;
    }
  });

  (function restore() {
    var saved = null;
    try { saved = JSON.parse(store.get('wall:timer') || 'null'); } catch (e) {}
    if (saved && saved.end) {
      timer.end = saved.end;
      timer.mins = saved.mins || 0;
      if (Date.now() < timer.end) tRun();
      else if (Date.now() - timer.end < T_RING_MAX) tRing();   // it ran out while the page was reloading
      else tCancel();
    }
    tRender();
  })();

  /* ------------------------------------------------------------- live --- */
  // The bot says "changed" down this socket the moment a task is added or done
  // from the chat. Phones and tablets drop idle sockets without a word, so a
  // ping goes up every 30 s, and a dead socket is replaced with growing pauses.
  var sock = null, retry = 1000, pinger = null, nudge = null, again = null;
  function live() {
    clearTimeout(again);
    if (sock || !key || !('WebSocket' in window)) return;
    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host
      + '/api/wall/live?k=' + encodeURIComponent(key);
    try { sock = new WebSocket(url); } catch (e) { return later(); }
    sock.onopen = function () {
      retry = 1000;
      // Anything that changed while we were disconnected.
      load();
      clearInterval(pinger);
      pinger = setInterval(function () { try { sock.send('ping'); } catch (e) {} }, 30000);
    };
    sock.onmessage = function (e) {
      if (e.data !== 'changed') return;
      // One chat turn can change several tasks; one refetch covers them all.
      clearTimeout(nudge);
      nudge = setTimeout(load, 400);
    };
    sock.onclose = function () { clearInterval(pinger); sock = null; later(); };
    sock.onerror = function () { try { sock.close(); } catch (e) {} };
  }
  function later() {
    clearTimeout(again);
    again = setTimeout(live, retry);
    retry = Math.min(retry * 2, 60000);
  }

  /* ------------------------------------------------------------- wake --- */
  // A wall display that sleeps after two minutes is a black rectangle.
  var lock = null;
  function wake() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) {
      lock = l;
      $('wake').hidden = true;
      l.addEventListener('release', function () { lock = null; });
    }).catch(function () {
      // Some browsers grant it only after a tap.
      $('wake').hidden = false;
    });
  }
  // Browsers grant full screen only from a tap, so any tap on the wall asks
  // for it — opened from a plain tab, one touch hides the address bar.
  function fullscreen() {
    var el = document.documentElement;
    if (document.fullscreenElement || !el.requestFullscreen) return;
    el.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
  }
  document.addEventListener('click', function () { wake(); fullscreen(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { if (!lock) wake(); if (!sock) live(); load(); }
  });

  window.addEventListener('resize', function () { if (state.data) render(); });
  setInterval(peek, PEEK_EVERY);

  tick();
  drift();
  load();
  live();
  wake();
  setInterval(tick, 5000);
  setInterval(load, REFRESH_MS);
  setInterval(drift, 60 * 60 * 1000);
})();
</script>
</body>
</html>
