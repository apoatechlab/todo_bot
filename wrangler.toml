name = "family-todo-bot"
main = "src/index.js"
compatibility_date = "2026-08-19"

# Non-secret configuration. Secrets go via `wrangler secret put` (see README).
# fetch / FormData / Blob / crypto.randomUUID are all native to workerd,
# so nodejs_compat is deliberately not enabled.
[vars]
TODOIST_PROJECT_ID = "REPLACE_ME"          # last path segment of the project URL
TZ_NAME            = "Europe/Madrid"
TODOIST_DUE_LANG   = "ru"
ALLOWED_CHAT_IDS   = "REPLACE_ME"          # comma-separated Telegram chat ids
ALLOW_DELETE       = "false"               # deletes are mapped to complete
# "true" deletes the person's message once it has produced a task, so the chat
# keeps the bot's confirmation and not the stream of «купи молоко». Requires
# can_delete_messages in a group. Questions and chit-chat are never deleted.
DELETE_REQUESTS    = "false"
CLAUDE_MODEL       = "claude-sonnet-5"
CLAUDE_EFFORT      = "low"                 # low | medium | high | xhigh | max

# Morning digest (see [triggers] below).
DIGEST_CHAT_ID     = "REPLACE_ME"          # where the digest is posted
DIGEST_AT          = "07:30"               # local time in TZ_NAME
DIGEST_SKIP_EMPTY  = "true"                # "false" = post even with nothing due
SUGGEST_COUNT      = "5"                   # undated tasks suggested after the digest; 0 = off

# Mini App: the calendar behind the digest button. Create it once with
# BotFather /newapp (Web App URL = https://<worker-host>/app), then put the bot
# username and the app short name here. Leave either blank to drop the button.
BOT_USERNAME       = "REPLACE_ME"          # without the @
MINIAPP_SHORT_NAME = "REPLACE_ME"          # the short name you gave /newapp

# Document archive. The bot creates this folder in the Drive of whoever
# authorised it (scope drive.file — it can touch nothing else there); share it
# with the family from the Drive UI. See README §11 for the one-time OAuth.
DRIVE_ROOT_NAME    = "Документы семьи"
# Pin the archive folder by id once you have moved it somewhere — e.g. inside a
# folder shared with the family. Empty = look it up by name in the Drive root.
# /docs prints the current id. See README §11.
DRIVE_ROOT_ID      = ""

# Weekend ideas — Thursday evening (see [triggers] below). The pool is tasks
# carrying WEEKEND_LABEL in Todoist; the bot sets it itself when a task is an
# outing rather than an errand, and «это на выходные» sets it by hand.
WEEKEND_LABEL      = "выходные"            # Todoist label marking a weekend idea
WEEKEND_AT         = "18:00"               # local time in TZ_NAME, Thursdays
WEEKEND_COUNT      = "6"                   # how many undated ideas to offer
# WEEKEND_CHAT_ID  = ""                    # defaults to DIGEST_CHAT_ID

# Due-soon alerts (every 5 min).
ALERT_LEAD_MIN     = "5"                   # warn this many minutes ahead
ALERT_MIN_PRIORITY = "2"                   # API scale: 1=default, so 2 = above default
# ALERT_CHAT_ID    = ""                    # defaults to DIGEST_CHAT_ID

# Create with: wrangler kv namespace create CHATS
[[kv_namespaces]]
binding = "CHATS"
id      = "REPLACE_ME"

# Cloudflare cron is UTC-only. 05:30 UTC = 07:30 CEST (summer),
# 06:30 UTC = 07:30 CET (winter). The handler checks local time and the
# off-season firing returns immediately, so exactly one digest goes out.
# The */5 entry drives dueSoonAlerts instead; scheduled() dispatches on event.cron.
[triggers]
# 16:00 UTC = 18:00 CEST, 17:00 UTC = 18:00 CET — the Thursday pair for
# weekendIdeas, which checks the local clock and lets exactly one through.
crons = ["30 5 * * *", "30 6 * * *", "*/5 * * * *", "0 16 * * 4", "0 17 * * 4"]

# src/app.html is the Mini App page; this rule bundles it in as a string.
[[rules]]
type   = "Text"
globs  = ["**/*.html"]
fallthrough = false

[observability]
enabled = true
